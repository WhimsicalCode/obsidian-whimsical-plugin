name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Lint, test, and build
        run: npm run check

      - name: Verify tag matches manifest and package versions
        run: |
          node -e '
            const fs = require("fs");

            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            const tag = process.env.GITHUB_REF_NAME;

            const checks = [
              [`tag (${tag}) == manifest.json version (${manifest.version})`, tag === manifest.version],
              [`manifest.json version (${manifest.version}) == package.json version (${pkg.version})`, manifest.version === pkg.version],
              [`versions.json["${manifest.version}"] (${versions[manifest.version]}) == manifest.json minAppVersion (${manifest.minAppVersion})`, versions[manifest.version] === manifest.minAppVersion],
            ];

            const failed = checks.filter(([, ok]) => !ok);
            for (const [description] of failed) {
              console.error(`Version check failed: ${description}`);
            }

            if (failed.length > 0) {
              process.exit(1);
            }

            console.log(`Version check passed for ${tag}`);
          '

      - name: Attest release asset provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --generate-notes
